name: Pipeline de Validação de Qualidade (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Executar Testes e Validações
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipagem TypeScript
        run: npx vue-tsc --noEmit

      - name: Executar testes unitários
        run: npm run test

      - name: Instalar navegadores do Playwright
        run: npx playwright install chromium

      - name: Executar testes End-to-End (E2E)
        run: npm run test:e2e
        env:
          NUXT_SESSION_PASSWORD: "dummy-password-for-testing-at-least-32-characters-long"
          SKIP_DB_CHECK: "true"